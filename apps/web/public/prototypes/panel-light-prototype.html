<!doctype html>
<!-- Accepted lighting values: continuous panel rims and subtle engaged-only Action item reflections. Defaults capture the user’s selected settings. -->
<html lang="en" data-theme="nord"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surface lighting · temporary controls</title><link rel="stylesheet" href="/design-system.css"><script type="module" src="/assets/prototypes/panel-light-prototype.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:var(--text-body)/var(--leading-standard) var(--font-sans)}main{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh}aside{padding:12px;border-bottom:1px solid var(--line);max-height:55dvh;overflow:auto}h1{font-size:var(--text-title);color:var(--text-bright);margin:0}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}p{margin:0}details{margin-top:8px}summary{cursor:pointer;color:var(--text-bright)}.sliders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 16px;margin-top:12px}label{display:block}label span{display:flex;justify-content:space-between;gap:8px}output{color:var(--text-bright);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0 0}iframe{width:100%;height:100%;border:0}.actions{display:flex;align-items:center;gap:16px;margin-top:14px}.scope{display:flex;align-items:center;gap:8px;margin-top:10px}textarea{width:100%;margin-top:8px;min-height:190px;font-family:var(--font-mono);font-size:var(--text-code)}@media(max-width:700px){.sliders{grid-template-columns:repeat(2,minmax(0,1fr))}header{display:block}}
</style></head><body><main data-controller="panel-light"><aside><header><h1>Surface lighting</h1><p>Temporary controls · try hovering the workspace and project rows.</p></header><details><summary>Panels · your chosen values</summary><div class="sliders"><label><span>Reflection strength<output data-output="panels-strength">44%</output></span><input type="range" name="strength" min="0" max="100" value="44" data-group="panels" data-unit="%" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Reflection whiteness<output data-output="panels-whiteness">14%</output></span><input type="range" name="whiteness" min="0" max="100" value="14" data-group="panels" data-unit="%" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Light position<output data-output="panels-position">28%</output></span><input type="range" name="position" min="0" max="100" value="28" data-group="panels" data-unit="%" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Horizontal spread<output data-output="panels-width">133%</output></span><input type="range" name="width" min="10" max="180" value="133" data-group="panels" data-unit="%" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Vertical reach<output data-output="panels-reach">180px</output></span><input type="range" name="reach" min="1" max="240" value="180" data-group="panels" data-unit="px" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Inner glow strength<output data-output="panels-glow">11%</output></span><input type="range" name="glow" min="0" max="40" value="11" data-group="panels" data-unit="%" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Inner glow depth<output data-output="panels-glowReach">7px</output></span><input type="range" name="glowReach" min="1" max="25" value="7" data-group="panels" data-unit="px" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Base outline contrast<output data-output="panels-outline">36%</output></span><input type="range" name="outline" min="0" max="70" value="36" data-group="panels" data-unit="%" data-panel-light-target="slider" data-action="input->panel-light#update"></label></div></details><details open><summary>Action items</summary><label class="scope">Show effect on <select class="popup-select" data-panel-light-target="scope" data-action="change->panel-light#update"><option value="engaged">Selected, hovered and focused items</option><option value="all">All items</option></select></label><div class="sliders"><label><span>Reflection strength<output data-output="actionItems-strength">27%</output></span><input type="range" name="strength" min="0" max="100" value="27" data-group="actionItems" data-unit="%" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Reflection whiteness<output data-output="actionItems-whiteness">32%</output></span><input type="range" name="whiteness" min="0" max="100" value="32" data-group="actionItems" data-unit="%" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Light position<output data-output="actionItems-position">21%</output></span><input type="range" name="position" min="0" max="100" value="21" data-group="actionItems" data-unit="%" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Horizontal spread<output data-output="actionItems-width">147%</output></span><input type="range" name="width" min="10" max="180" value="147" data-group="actionItems" data-unit="%" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Vertical reach<output data-output="actionItems-reach">21px</output></span><input type="range" name="reach" min="1" max="240" value="21" data-group="actionItems" data-unit="px" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Inner glow strength<output data-output="actionItems-glow">10%</output></span><input type="range" name="glow" min="0" max="40" value="10" data-group="actionItems" data-unit="%" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Inner glow depth<output data-output="actionItems-glowReach">2px</output></span><input type="range" name="glowReach" min="1" max="25" value="2" data-group="actionItems" data-unit="px" data-panel-light-target="slider" data-action="input->panel-light#update"></label><label><span>Base outline contrast<output data-output="actionItems-outline">12%</output></span><input type="range" name="outline" min="0" max="70" value="12" data-group="actionItems" data-unit="%" data-panel-light-target="slider" data-action="input->panel-light#update"></label></div></details><div class="actions"><button class="button secondary" type="button" data-action="panel-light#reset"><span class="button__caption">Reset tuning</span></button><details><summary>Values to share</summary><textarea class="textarea" aria-label="Surface lighting values" readonly data-panel-light-target="settings"></textarea></details></div></aside><iframe title="Live Atelier surface preview" data-panel-light-target="frame" data-action="load->panel-light#update" src="/workspaces/e096c28b?workView=terminal%3Aabb96ea8-2df8-4c74-9c84-86e2e4110062"></iframe></main></body></html>
