[install]
# Save newly added direct dependencies as exact versions instead of ranges.
exact = true

# Normal installs must not change bun.lock. Dependency changes require an explicit
# update/add command with --no-frozen-lockfile and a reviewed package/lockfile diff.
frozenLockfile = true

[test]
# Lint alongside every test run, including single files and directories, and keep
# tests out of the real host data directory.
preload = ["./scripts/test-lint-preload.ts", "./scripts/test-data-dir-preload.ts"]
